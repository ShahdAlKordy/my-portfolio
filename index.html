                        width={size}
                        height={size}
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke={color}
                        strokeWidth="2"
                        strokeLinecap="round"
                        strokeLinejoin="round"

        const TypewriterEffect = ({ words }) => {
            const [index, setIndex] = useState(0);
            const [subIndex, setSubIndex] = useState(0);
            const [reverse, setReverse] = useState(false);
            const [blink, setBlink] = useState(true);

            useEffect(() => {
                const timeout2 = setTimeout(() => setBlink((prev) => !prev), 500);
                return () => clearTimeout(timeout2);
            }, [blink]);

            useEffect(() => {
                if (index === words.length) return;
                if (subIndex === words[index].length + 1 && !reverse) {
                    setTimeout(() => setReverse(true), 1000);
                    return;
                }
                if (subIndex === 0 && reverse) {
                    setReverse(false);
                    setIndex((prev) => (prev + 1) % words.length);
                    return;
                }
                const timeout = setTimeout(() => {
                    setSubIndex((prev) => prev + (reverse ? -1 : 1));
                }, Math.max(reverse ? 75 : subIndex === words[index].length ? 1000 : 150, Math.random() * 350));
                return () => clearTimeout(timeout);
            }, [subIndex, index, reverse, words]);

            return (
                <span className="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-500 border-r-2 border-cyan-400 pr-1">
                    {`${words[index].substring(0, subIndex)}${blink ? "" : " "}`}
                </span>
            );
        };

            useEffect(() => {

                    entries.forEach(entry => setIsVisible(entry.isIntersecting));
                });
                if (domRef.current) observer.observe(domRef.current);
                return () => domRef.current && observer.unobserve(domRef.current);
            }, []);
            return (
                <div ref={domRef} className={`transition-all duration-1000 transform ${isVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10'} ${className}`}>

                                {Icon && <Icon className="w-6 h-6 text-cyan-400" />}

                            {verified ? (
                                <div className="flex items-center gap-1 text-green-400 animate-pulse">
                                    {CheckCircle2 && <CheckCircle2 className="w-4 h-4" />}

                                </div>

                                <button onClick={() => setVerified(true)} className="text-[10px] font-bold uppercase tracking-wider text-slate-500 hover:text-cyan-400 border border-slate-700 px-2 py-1 rounded hover:border-cyan-400 transition-all">Verify</button>
                            )}

                        <p className="text-slate-400 text-sm leading-snug">{cert.desc}</p>
                        <div className="absolute inset-0 opacity-0 group-hover:opacity-10 pointer-events-none bg-gradient-to-tr from-transparent via-cyan-300 to-transparent transform -translate-x-full group-hover:translate-x-full transition-transform duration-1000"></div>
                    </div>
                </div>
            );
        };

        const TimelineItem = ({ data, isLast }) => (
            <div className="relative pl-8 pb-12 group">
                {!isLast && <div className="absolute left-[11px] top-8 bottom-0 w-0.5 bg-slate-700 group-hover:bg-cyan-900/50 transition-colors"></div>}
                <div className="absolute left-0 top-1 w-6 h-6 bg-slate-900 rounded-full border-2 border-cyan-500 flex items-center justify-center z-10 group-hover:scale-110 transition-transform shadow-[0_0_10px_rgba(6,182,212,0.3)]">
                    <div className="w-2 h-2 bg-cyan-400 rounded-full"></div>
                </div>
                <div className="bg-slate-800/40 p-5 rounded-lg border border-slate-700/50 hover:border-cyan-500/30 transition-all hover:translate-x-1">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between mb-2">
                        <h3 className="text-xl font-bold text-white group-hover:text-cyan-300 transition-colors">{data.role || data.degree}</h3>
                        <span className="text-xs font-mono text-cyan-400 bg-cyan-950/30 px-2 py-1 rounded border border-cyan-900/50">{data.period}</span>
                    </div>
                    <div className="text-base text-slate-300 font-medium mb-2">{data.company || data.school}{data.grade && <span className="text-slate-500 text-sm ml-2">• {data.grade}</span>}</div>
                    <p className="text-slate-400 text-sm leading-relaxed whitespace-pre-line">{data.desc || data.detail}</p>
                </div>
            </div>
        );

        const getStatusBadge = (status) => {
            switch(status) {
                case 'Completed':
                    return {
                        bg: 'bg-emerald-950/80 border-emerald-500/50 text-emerald-300',
                        dot: 'bg-emerald-400',
                        label: 'Completed',
                        labelAr: 'مكتمل'
                    };
                case 'Prototype':
                    return {
                        bg: 'bg-amber-950/80 border-amber-500/50 text-amber-300',
                        dot: 'bg-amber-400',
                        label: 'Prototype',
                        labelAr: 'نموذج أولي'
                    };
                case 'Concept':
                    return {
                        bg: 'bg-purple-950/80 border-purple-500/50 text-purple-300',
                        dot: 'bg-purple-400',
                        label: 'Concept',
                        labelAr: 'فكرة تصميمية'
                    };
                case 'Case Study':
                default:
                    return {
                        bg: 'bg-cyan-950/80 border-cyan-500/50 text-cyan-300',
                        dot: 'bg-cyan-400',
                        label: 'Case Study',
                        labelAr: 'دراسة تحليلية'
                    };
            }
        };

        const getCategoryIcon = (category) => {
            if (!category) return Layers;
            const cat = category.toLowerCase();
            if (cat.includes('data') || cat.includes('power bi')) return BarChart3;
            if (cat.includes('coo') || cat.includes('commerce') || cat.includes('logistics')) return Truck || Layers;
            if (cat.includes('automation') || cat.includes('software')) return Code2;
            if (cat.includes('mobile') || cat.includes('field')) return Smartphone || Layers;
            if (cat.includes('ai') || cat.includes('intelligence')) return BrainCircuit;
            return Layers;
        };

            const statusInfo = getStatusBadge(project.projectStatus);

                <div 
                    onClick={() => onOpenModal(project)}

                    <div>
                        <div className="flex items-center justify-between gap-3 mb-4">
                            <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-mono font-bold bg-gradient-to-r from-cyan-500/20 to-blue-500/20 border border-cyan-500/40 text-cyan-300 shadow-sm">
                                {Sparkles && <Sparkles className="w-3.5 h-3.5 text-cyan-400" />} TOP 0{rank}
                            </span>
                            <span className={`inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold border ${statusInfo.bg}`}>
                                <span className={`w-1.5 h-1.5 rounded-full ${statusInfo.dot} animate-pulse`}></span>
                                {statusInfo.label}
                            </span>
                        </div>

                        <div className="flex items-start gap-3 mb-2">
                            <div className="p-2.5 bg-slate-900 rounded-xl border border-slate-700 group-hover:border-cyan-500/40 transition-colors shrink-0">
                                {CategoryIcon && <CategoryIcon className="w-5 h-5 text-cyan-400" />}
                            </div>
                            <div>
                                <h4 className="text-xl font-extrabold text-white group-hover:text-cyan-300 transition-colors leading-snug">
                                    {project.title}
                                </h4>
                                {project.titleAr && (
                                    <p className="text-xs text-slate-400 font-medium mt-0.5" style={{ direction: 'rtl' }}>
                                        {project.titleAr}
                                    </p>
                                )}
                            </div>
                        </div>

                        <p className="text-slate-300 text-sm leading-relaxed mb-4 line-clamp-3">
                            {project.summary || project.desc}
                        </p>

                        {project.businessProblem && (
                            <div className="bg-slate-900/80 rounded-xl p-3.5 border border-slate-700/60 mb-4 text-xs space-y-2">
                                <div>
                                    <span className="text-amber-400 font-bold block mb-0.5 uppercase tracking-wider text-[10px]">Business Challenge:</span>
                                    <p className="text-slate-300 line-clamp-2">{project.businessProblem}</p>
                                </div>
                                {project.businessImpact && (
                                    <div className="border-t border-slate-800 pt-2">
                                        <span className="text-cyan-400 font-bold block mb-0.5 uppercase tracking-wider text-[10px]">Business Impact:</span>
                                        <p className="text-slate-300 line-clamp-2">{project.businessImpact}</p>
                                    </div>
                                )}
                            </div>
                        )}

                        <div className="flex flex-wrap gap-1.5 mb-4">
                            {techList.slice(0, 5).map((tech, idx) => (
                                <span key={idx} className="text-[11px] font-mono px-2 py-0.5 bg-cyan-950/40 text-cyan-300 border border-cyan-800/50 rounded-md">
                                    {tech}
                                </span>
                            ))}
                            {techList.length > 5 && (
                                <span className="text-[11px] font-mono px-1.5 py-0.5 bg-slate-800 text-slate-400 rounded-md">
                                    +{techList.length - 5}

                            )}
                        </div>
                    </div>

                    <div className="mt-2 pt-3 border-t border-slate-700/60">
                        <button

                        >
                            Explore Case Study {ChevronRight && <ChevronRight className="w-4 h-4 group-hover:translate-x-1 transition-transform" />}
                        </button>
                    </div>
                </div>
            );
        };

        const ProjectCard = ({ project, onOpenModal }) => {
            const statusInfo = getStatusBadge(project.projectStatus);
            const CategoryIcon = getCategoryIcon(project.category);
            const techList = Array.isArray(project.technologies) ? project.technologies : (project.tech ? project.tech.split(', ') : []);

            return (
                <div 
                    onClick={() => onOpenModal(project)}

                >
                    <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-cyan-500 to-blue-500 transform scale-x-0 group-hover:scale-x-100 transition-transform duration-300 origin-left"></div>

                                <span className={`px-2 py-0.5 rounded-full text-[10px] font-semibold border ${statusInfo.bg}`}>
                                    {statusInfo.label}
                                </span>
                            </div>

                                {project.category}
                            </div>

                                <p className="text-xs text-slate-400 mb-3" style={{ direction: 'rtl' }}>

                                {project.summary || project.desc}

                        </div>

                        <div>
                            <div className="flex flex-wrap gap-1.5 mb-3">
                                {techList.slice(0, 4).map((tag, i) => (
                                    <span key={i} className="text-[11px] font-medium text-cyan-300 bg-cyan-900/30 border border-cyan-800/50 px-2 py-0.5 rounded">
                                        {tag}
                                    </span>
                                ))}
                                {techList.length > 4 && (
                                    <span className="text-[11px] text-slate-500 px-1 py-0.5">+{techList.length - 4}</span>
                                )}
                            </div>

                            <button 
                                onClick={() => onOpenModal(project)}
                                className="w-full py-2 bg-slate-800 group-hover:bg-cyan-950/60 border border-slate-700 group-hover:border-cyan-500/50 rounded-lg text-xs font-bold text-slate-300 group-hover:text-cyan-300 flex items-center justify-center gap-1.5 transition-all"
                            >
                                View Case Study {ExternalLink && <ExternalLink className="w-3.5 h-3.5" />}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const ProjectCaseStudyModal = ({ project, onClose, onPrev, onNext }) => {
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'Escape') onClose();
                    if (e.key === 'ArrowLeft' && onPrev) onPrev();
                    if (e.key === 'ArrowRight' && onNext) onNext();
                };
                window.addEventListener('keydown', handleKeyDown);
                document.body.style.overflow = 'hidden';
                return () => {
                    window.removeEventListener('keydown', handleKeyDown);
                    document.body.style.overflow = 'auto';
                };
            }, [onClose, onPrev, onNext]);

            if (!project) return null;

            const statusInfo = getStatusBadge(project.projectStatus);
            const CategoryIcon = getCategoryIcon(project.category);
            const techList = Array.isArray(project.technologies) ? project.technologies : (project.tech ? project.tech.split(', ') : []);

            // Safe icon components to prevent any undeclared icon crash
            const AlertCircleIcon = Icons.AlertCircle || (() => <span className="text-amber-400 font-bold">⚠️</span>);
            const LightbulbIcon = Icons.Lightbulb || (() => null);
            const CheckCircle2Icon = Icons.CheckCircle2 || (() => <span className="text-cyan-400 font-bold">✓</span>);
            const TerminalIcon = Icons.Terminal || (() => null);
            const ActivityIcon = Icons.Activity || (() => null);
            const LayersIcon = Icons.Layers || (() => null);
            const TrendingUpIcon = Icons.TrendingUp || Icons.BarChart3 || (() => null);
            const ExternalLinkIcon = Icons.ExternalLink || (() => null);
            const Code2Icon = Icons.Code2 || (() => null);
            const FileTextIcon = Icons.FileText || (() => null);
            const ShieldCheckIcon = Icons.ShieldCheck || Icons.Award || (() => null);
            const ChevronLeftIcon = Icons.ChevronLeft || (() => null);
            const ChevronRightIcon = Icons.ChevronRight || (() => null);
            const XIcon = Icons.X || (() => <span className="font-bold">✕</span>);

            return (
                <div 
                    className="fixed inset-0 z-[70] flex items-center justify-center p-3 sm:p-6 bg-slate-950/85 backdrop-blur-md animate-fade-in"

                        className="bg-slate-900 border border-slate-700 w-full max-w-4xl max-h-[92vh] rounded-3xl shadow-2xl flex flex-col relative overflow-hidden animate-in fade-in zoom-in-95 duration-200"
                        onClick={(e) => e.stopPropagation()}
                    >
                        <div className="h-2 w-full bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-500"></div>

                            <div className="flex items-start gap-3.5 sm:gap-4">
                                <div className="p-3 bg-slate-800/90 rounded-2xl border border-slate-700 shrink-0 shadow-inner">
                                    {CategoryIcon && <CategoryIcon className="w-6 h-6 sm:w-7 sm:h-7 text-cyan-400" />}
                                </div>
                                <div>
                                    <div className="flex flex-wrap items-center gap-2 mb-2">
                                        <span className="text-[11px] font-bold text-cyan-400 uppercase tracking-widest bg-cyan-950/70 border border-cyan-800/70 px-2.5 py-0.5 rounded-full">
                                            {project.category}
                                        </span>
                                        <span className={`text-[11px] font-semibold px-2.5 py-0.5 rounded-full border ${statusInfo.bg}`}>
                                            {statusInfo.label} ({statusInfo.labelAr})
                                        </span>
                                        {project.projectType && (
                                            <span className="text-[11px] text-cyan-300 bg-slate-800 px-2.5 py-0.5 rounded-full border border-slate-700 font-mono">
                                                {project.projectType}
                                            </span>
                                        )}
                                        {project.industry && (
                                            <span className="text-[11px] text-slate-400 bg-slate-800/80 px-2.5 py-0.5 rounded-full border border-slate-700">
                                                {project.industry}
                                            </span>
                                        )}
                                    </div>
                                    <h2 className="text-xl sm:text-2xl md:text-3xl font-extrabold text-white leading-tight">
                                        {project.title}
                                    </h2>
                                    {project.titleAr && (
                                        <p className="text-sm sm:text-base text-cyan-300 font-medium mt-1 leading-snug" style={{ direction: 'rtl' }}>
                                            {project.titleAr}
                                        </p>
                                    )}
                                </div>
                            </div>
                            <button 
                                onClick={onClose}
                                className="p-2 hover:bg-slate-800 text-slate-400 hover:text-white rounded-full transition-colors shrink-0"
                                title="Close (Esc)"
                            >
                                <XIcon className="w-5 h-5 sm:w-6 sm:h-6" />
                            </button>
                        </div>

                        {/* Modal Scrollable Body */}
                        <div className="flex-1 overflow-y-auto p-5 sm:p-7 space-y-7 bg-slate-900/60 text-slate-300">
                            
                            {/* Executive Summary */}
                            <div className="bg-slate-800/60 p-5 rounded-2xl border-l-4 border-cyan-500 space-y-2.5">
                                <h4 className="text-xs font-bold text-cyan-300 uppercase tracking-wider flex items-center gap-2">
                                    <FileTextIcon className="w-4 h-4" /> Executive Summary & Strategic Scope
                                </h4>
                                <p className="text-slate-200 text-sm sm:text-base leading-relaxed">
                                    {project.summary || project.desc}
                                </p>
                                {project.summaryAr && (
                                    <p className="text-slate-400 text-sm leading-relaxed pt-2 border-t border-slate-700/60 font-medium" style={{ direction: 'rtl' }}>
                                        {project.summaryAr}
                                    </p>
                                )}
                            </div>

                            {/* Two-Column: Business Problem & Engineered Solution */}
                            <div className="grid md:grid-cols-2 gap-5">
                                <div className="bg-slate-800/40 p-5 rounded-2xl border border-slate-700/70 flex flex-col justify-between">
                                    <div>
                                        <h4 className="text-amber-400 font-bold text-xs uppercase tracking-wider mb-2.5 flex items-center gap-2">
                                            <AlertCircleIcon className="w-4 h-4 text-amber-400 shrink-0" /> Business Problem & Operational Context
                                        </h4>
                                        <p className="text-slate-300 text-sm leading-relaxed">
                                            {project.businessProblem || "Operational data fragmentation and lack of real-time visibility impeded executive decision-making and performance monitoring."}
                                        </p>
                                    </div>
                                </div>

                                <div className="bg-slate-800/40 p-5 rounded-2xl border border-slate-700/70 flex flex-col justify-between">
                                    <div>
                                        <h4 className="text-cyan-400 font-bold text-xs uppercase tracking-wider mb-2.5 flex items-center gap-2">
                                            <LightbulbIcon className="w-4 h-4 text-cyan-400 shrink-0" /> Engineered Solution & Architecture
                                        </h4>
                                        <p className="text-slate-300 text-sm leading-relaxed">
                                            {project.solution || "Architected an end-to-end data and operational system with automated data pipelines, custom logic, and decision dashboards."}
                                        </p>
                                    </div>
                                </div>
                            </div>

                            {/* Key Capabilities & Features */}
                            {Array.isArray(project.features) && project.features.length > 0 && (
                                <div>
                                    <h4 className="text-white font-bold text-sm uppercase tracking-wider mb-3 flex items-center gap-2">
                                        <CheckCircle2Icon className="w-4 h-4 text-cyan-400" /> Key Capabilities & Engineered Features
                                    </h4>
                                    <div className="grid sm:grid-cols-2 gap-3">
                                        {project.features.map((feat, idx) => (
                                            <div key={idx} className="bg-slate-800/40 p-3.5 rounded-xl border border-slate-700/60 flex items-start gap-2.5 text-xs sm:text-sm">
                                                <span className="w-2 h-2 rounded-full bg-cyan-400 mt-1.5 shrink-0 shadow-sm shadow-cyan-400/50"></span>
                                                <span className="text-slate-200 leading-snug">{feat}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* Technologies & Tracked KPIs */}
                            <div className="grid md:grid-cols-2 gap-5">
                                <div className="bg-slate-800/30 p-5 rounded-2xl border border-slate-700/60">
                                    <h4 className="text-white font-bold text-xs uppercase tracking-wider mb-3 flex items-center gap-2">
                                        <TerminalIcon className="w-4 h-4 text-cyan-400" /> Technical Arsenal & Tools
                                    </h4>
                                    <div className="flex flex-wrap gap-2">
                                        {techList.map((tech, idx) => (
                                            <span key={idx} className="px-3 py-1 bg-cyan-950/60 border border-cyan-800 text-cyan-300 text-xs font-mono font-semibold rounded-lg shadow-sm">
                                                {tech}
                                            </span>
                                        ))}
                                    </div>
                                </div>

                                <div className="bg-slate-800/30 p-5 rounded-2xl border border-slate-700/60">
                                    <h4 className="text-white font-bold text-xs uppercase tracking-wider mb-3 flex items-center gap-2">
                                        <ActivityIcon className="w-4 h-4 text-cyan-400" /> Tracked Business KPIs & Metrics
                                    </h4>
                                    <div className="space-y-2">
                                        {Array.isArray(project.kpis) && project.kpis.length > 0 ? (
                                            project.kpis.map((kpi, idx) => (
                                                <div key={idx} className="flex items-center gap-2 text-xs text-slate-200 bg-slate-900/60 px-3 py-1.5 rounded-lg border border-slate-800">
                                                    <span className="text-cyan-400 font-bold">•</span> {kpi}
                                                </div>
                                            ))
                                        ) : (
                                            <span className="text-xs text-slate-400">KPI tracking configured per stakeholder requirements.</span>
                                        )}
                                    </div>
                                </div>
                            </div>

                            {/* End-to-End Workflow Pipeline */}
                            {Array.isArray(project.workflow) && project.workflow.length > 0 && (
                                <div>
                                    <h4 className="text-white font-bold text-sm uppercase tracking-wider mb-3 flex items-center gap-2">
                                        <LayersIcon className="w-4 h-4 text-cyan-400" /> End-to-End Execution Pipeline
                                    </h4>
                                    <div className="space-y-2.5">
                                        {project.workflow.map((step, idx) => (
                                            <div key={idx} className="bg-slate-800/50 p-3.5 rounded-xl border border-slate-700/60 text-xs sm:text-sm text-slate-200 flex items-start gap-3">
                                                <span className="px-2 py-0.5 bg-cyan-900/40 text-cyan-400 font-mono text-xs rounded border border-cyan-800 shrink-0 font-bold">
                                                    0{idx + 1}
                                                </span>
                                                <span className="leading-relaxed">{step}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* Business Value & Impact */}
                            {project.businessImpact && (
                                <div className="bg-gradient-to-r from-cyan-950/50 via-slate-900 to-blue-950/40 p-5 rounded-2xl border border-cyan-500/30">
                                    <h4 className="text-cyan-300 font-bold text-xs uppercase tracking-wider mb-2 flex items-center gap-2">
                                        <TrendingUpIcon className="w-4 h-4 text-cyan-400" /> Measurable Business Value & Operational ROI
                                    </h4>
                                    <p className="text-slate-200 text-sm leading-relaxed">
                                        {project.businessImpact}
                                    </p>
                                </div>
                            )}

                            {/* Project Assets & Verification */}
                            <div>
                                <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Project Assets & Verification</h4>
                                <div className="flex flex-wrap gap-3">
                                    {project.liveDemoUrl && (
                                        <a href={project.liveDemoUrl} target="_blank" rel="noreferrer" className="px-4 py-2.5 bg-cyan-600 hover:bg-cyan-500 text-white rounded-xl text-xs font-bold flex items-center gap-2 transition-all shadow-md shadow-cyan-500/20">
                                            <ExternalLinkIcon className="w-4 h-4" /> Live Interactive Demo
                                        </a>
                                    )}
                                    {project.githubUrl && (
                                        <a href={project.githubUrl} target="_blank" rel="noreferrer" className="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white rounded-xl text-xs font-bold flex items-center gap-2 transition-all">
                                            <Code2Icon className="w-4 h-4" /> GitHub Repository
                                        </a>
                                    )}
                                    {project.caseStudyUrl && (
                                        <a href={project.caseStudyUrl} target="_blank" rel="noreferrer" className="px-4 py-2.5 bg-purple-600 hover:bg-purple-500 text-white rounded-xl text-xs font-bold flex items-center gap-2 transition-all shadow-md">
                                            <FileTextIcon className="w-4 h-4" /> Technical Documentation
                                        </a>
                                    )}
                                    {!project.liveDemoUrl && !project.githubUrl && !project.caseStudyUrl && (
                                        <div className="text-xs text-slate-400 bg-slate-800/60 p-3 rounded-xl border border-slate-700 flex items-center gap-2.5">
                                            <ShieldCheckIcon className="w-4 h-4 text-slate-400 shrink-0" />
                                            <span>Comprehensive operational & analytical case study. Client data and proprietary source code are maintained under strict enterprise confidentiality compliance.</span>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>

                        {/* Modal Footer with Previous / Next Controls */}
                        <div className="p-4 bg-slate-900 border-t border-slate-800 flex justify-between items-center">
                            <div className="flex gap-2">
                                {onPrev && (
                                    <button onClick={onPrev} className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all">
                                        <ChevronLeftIcon className="w-4 h-4" /> Previous Case Study
                                    </button>
                                )}
                                {onNext && (
                                    <button onClick={onNext} className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all">
                                        Next Case Study <ChevronRightIcon className="w-4 h-4" />
                                    </button>
                                )}
                            </div>
                            <button onClick={onClose} className="px-5 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white rounded-xl text-xs font-bold transition-all">
                                Close
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const ProjectsShowcase = () => {
            const [selectedCategory, setSelectedCategory] = useState("All Projects");
            const [searchQuery, setSearchQuery] = useState("");
            const [selectedIndustry, setSelectedIndustry] = useState("All");
            const [selectedStatus, setSelectedStatus] = useState("All");
            const [selectedProject, setSelectedProject] = useState(null);
            const [visibleCount, setVisibleCount] = useState(9);

            const allProjectsData = (typeof window !== 'undefined' && window.PORTFOLIO_PROJECTS_DATA) ? window.PORTFOLIO_PROJECTS_DATA : projects;

            const categories = [
                "All Projects",
                "Data Analysis & Power BI",
                "COO & E-commerce Operations",
                "Business Automation & Software",
                "Mobile Apps & Field Operations",
                "AI-Powered Business Solutions"
            ];

            const industries = [
                "All",
                "Retail & E-commerce",
                "Finance & Accounting",
                "Supply Chain & Logistics",
                "Operations Management",
                "Human Resources",
                "Customer Service",
                "Education & Training",
                "Manufacturing & Production",
                "Executive Management",
                "Healthcare Analytics"
            ];

            const statuses = ["All", "Completed", "Prototype", "Concept", "Case Study"];

            const filteredProjects = allProjectsData.filter(proj => {
                if (selectedCategory !== "All Projects" && proj.category !== selectedCategory) {
                    return false;
                }

                if (selectedIndustry !== "All") {
                    const hasIndustry = proj.industry === selectedIndustry || 
                        (Array.isArray(proj.subcategories) && proj.subcategories.includes(selectedIndustry));
                    if (!hasIndustry) return false;
                }

                if (selectedStatus !== "All" && proj.projectStatus !== selectedStatus) {
                    return false;
                }

                if (searchQuery.trim()) {
                    const q = searchQuery.toLowerCase().trim();
                    const titleMatch = (proj.title || "").toLowerCase().includes(q);
                    const titleArMatch = (proj.titleAr || "").includes(q);
                    const summaryMatch = (proj.summary || proj.desc || "").toLowerCase().includes(q);
                    const techMatch = (Array.isArray(proj.technologies) ? proj.technologies.join(' ') : (proj.tech || '')).toLowerCase().includes(q);
                    const keywordMatch = Array.isArray(proj.searchKeywords) && proj.searchKeywords.some(k => k.toLowerCase().includes(q));
                    const kpiMatch = Array.isArray(proj.kpis) && proj.kpis.some(k => k.toLowerCase().includes(q));
                    
                    return titleMatch || titleArMatch || summaryMatch || techMatch || keywordMatch || kpiMatch;
                }

                return true;
            });

            // Top 3 Spotlight for current category
            const topFeaturedProjects = React.useMemo(() => {
                let pool = allProjectsData;
                if (selectedCategory !== "All Projects") {
                    pool = pool.filter(p => p.category === selectedCategory);
                }
                const featured = pool.filter(p => p.featured);
                featured.sort((a, b) => (a.priority || 99) - (b.priority || 99));
                return featured.slice(0, 3);
            }, [selectedCategory, allProjectsData]);

            const handleNextProject = () => {
                if (!selectedProject) return;
                const currentIdx = filteredProjects.findIndex(p => p.id === selectedProject.id);
                if (currentIdx !== -1 && currentIdx < filteredProjects.length - 1) {
                    setSelectedProject(filteredProjects[currentIdx + 1]);
                } else if (filteredProjects.length > 0) {
                    setSelectedProject(filteredProjects[0]);
                }
            };

            const handlePrevProject = () => {
                if (!selectedProject) return;
                const currentIdx = filteredProjects.findIndex(p => p.id === selectedProject.id);
                if (currentIdx > 0) {
                    setSelectedProject(filteredProjects[currentIdx - 1]);
                } else if (filteredProjects.length > 0) {
                    setSelectedProject(filteredProjects[filteredProjects.length - 1]);
                }
            };

            const handleResetFilters = () => {
                setSelectedCategory("All Projects");
                setSearchQuery("");
                setSelectedIndustry("All");
                setSelectedStatus("All");
                setVisibleCount(9);
            };

            const hasActiveFilters = selectedCategory !== "All Projects" || searchQuery !== "" || selectedIndustry !== "All" || selectedStatus !== "All";

            return (
                <div className="space-y-16">
                    {selectedProject && (
                        <ProjectCaseStudyModal 
                            project={selectedProject} 
                            onClose={() => setSelectedProject(null)}
                            onPrev={handlePrevProject}
                            onNext={handleNextProject}
                        />
                    )}

                    <AnimatedSection>
                        <div className="text-center max-w-3xl mx-auto space-y-4">
                            <div className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-cyan-900/30 border border-cyan-500/40 text-cyan-400 text-xs font-mono font-bold uppercase tracking-widest shadow-sm">
                                {Sparkles && <Sparkles className="w-3.5 h-3.5 text-cyan-400" />} Solutions & Case Studies
                            </div>
                            <h2 className="text-4xl md:text-5xl font-extrabold text-white tracking-tight leading-tight">
                                Projects & Business Solutions
                            </h2>
                            <p className="text-slate-400 text-base md:text-lg leading-relaxed">
                                Bridging data analytics, business operations, and process automation into actionable digital systems.
                            </p>
                            <div className="flex flex-wrap items-center justify-center gap-3 pt-2 text-xs font-mono text-slate-400">
                                <span className="bg-slate-800/80 px-3 py-1 rounded-full border border-slate-700">
                                    📊 {allProjectsData.length} Total Solutions
                                </span>
                                <span className="bg-slate-800/80 px-3 py-1 rounded-full border border-slate-700">
                                    ⚙️ 5 Core Domains
                                </span>
                                <span className="bg-slate-800/80 px-3 py-1 rounded-full border border-slate-700">
                                    🎯 100% Verified Methodology
                                </span>
                            </div>
                        </div>
                    </AnimatedSection>

                    <AnimatedSection>
                        <div className="flex flex-wrap justify-center gap-2 sm:gap-3 p-1.5 bg-slate-900/80 backdrop-blur border border-slate-800 rounded-2xl max-w-5xl mx-auto">
                            {categories.map((cat, idx) => {
                                const count = cat === "All Projects" 
                                    ? allProjectsData.length 
                                    : allProjectsData.filter(p => p.category === cat).length;
                                const isActive = selectedCategory === cat;
                                return (
                                    <button
                                        key={idx}
                                        onClick={() => {
                                            setSelectedCategory(cat);
                                            setVisibleCount(9);
                                        }}
                                        className={`px-4 py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-200 flex items-center gap-2 ${
                                            isActive
                                                ? "bg-gradient-to-r from-cyan-600 to-blue-600 text-white font-bold shadow-lg shadow-cyan-500/25 scale-[1.02]"
                                                : "bg-slate-800/40 hover:bg-slate-800 text-slate-400 hover:text-slate-200 border border-slate-700/50"
                                        }`}
                                    >
                                        <span>{cat}</span>
                                        <span className={`text-[11px] px-2 py-0.5 rounded-full font-mono ${
                                            isActive ? "bg-white/20 text-white" : "bg-slate-800 text-slate-500"
                                        }`}>
                                            {count}
                                        </span>
                                    </button>
                                );
                            })}
                        </div>
                    </AnimatedSection>

                    <AnimatedSection>
                        <div className="bg-slate-800/40 p-4 sm:p-5 rounded-2xl border border-slate-700/70 max-w-5xl mx-auto space-y-4">
                            <div className="flex flex-col md:flex-row gap-3">
                                <div className="relative flex-1">
                                    <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                                        {Search ? <Search className="w-4 h-4 text-cyan-400" /> : <Terminal className="w-4 h-4 text-cyan-400" />}
                                    </div>
                                    <input
                                        type="text"
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        placeholder="Search by name, technology (Power BI, Python, SQL), KPI, or keyword..."
                                        className="w-full bg-slate-900 text-white text-sm rounded-xl pl-10 pr-10 py-3 border border-slate-700 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all placeholder:text-slate-500"
                                    />
                                    {searchQuery && (
                                        <button
                                            onClick={() => setSearchQuery("")}
                                            className="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-white"
                                        >
                                            {X && <X className="w-4 h-4" />}
                                        </button>
                                    )}
                                </div>

                                <div className="flex gap-2">
                                    <select
                                        value={selectedIndustry}
                                        onChange={(e) => setSelectedIndustry(e.target.value)}
                                        className="bg-slate-900 text-slate-300 text-xs sm:text-sm rounded-xl px-3 py-3 border border-slate-700 focus:outline-none focus:border-cyan-500"
                                    >
                                        <option value="All">All Industries</option>
                                        {industries.filter(i => i !== "All").map((ind, idx) => (
                                            <option key={idx} value={ind}>{ind}</option>
                                        ))}
                                    </select>

                                    <select
                                        value={selectedStatus}
                                        onChange={(e) => setSelectedStatus(e.target.value)}
                                        className="bg-slate-900 text-slate-300 text-xs sm:text-sm rounded-xl px-3 py-3 border border-slate-700 focus:outline-none focus:border-cyan-500"
                                    >
                                        <option value="All">All Statuses</option>
                                        {statuses.filter(s => s !== "All").map((st, idx) => (
                                            <option key={idx} value={st}>{st}</option>
                                        ))}
                                    </select>
                                </div>
                            </div>

                            <div className="flex flex-wrap items-center justify-between gap-3 text-xs text-slate-400 pt-1">
                                <div className="flex items-center gap-2">
                                    <span className="font-semibold text-slate-300">
                                        Showing {filteredProjects.length} of {allProjectsData.length} Projects
                                    </span>
                                    {hasActiveFilters && (
                                        <button
                                            onClick={handleResetFilters}
                                            className="text-cyan-400 hover:underline flex items-center gap-1 font-semibold ml-2"
                                        >
                                            {RefreshCw && <RefreshCw className="w-3 h-3" />} Reset Filters
                                        </button>
                                    )}
                                </div>
                                <div className="hidden sm:flex items-center gap-2 text-slate-500">
                                    <span>Click any card to inspect full case study</span>
                                </div>
                            </div>
                        </div>
                    </AnimatedSection>

                    {!searchQuery && selectedIndustry === "All" && selectedStatus === "All" && topFeaturedProjects.length > 0 && (
                        <AnimatedSection className="space-y-6">
                            <div className="flex flex-col sm:flex-row sm:items-end justify-between gap-3 border-b border-slate-800 pb-4">
                                <div>
                                    <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-mono font-bold bg-amber-500/10 text-amber-300 border border-amber-500/30 mb-2">
                                        {Medal && <Medal className="w-3.5 h-3.5 text-amber-400" />} TOP 3 SPOTLIGHT
                                    </div>
                                    <h3 className="text-2xl sm:text-3xl font-extrabold text-white">
                                        {selectedCategory === "All Projects" ? "Flagship Featured Solutions" : `Top 3: ${selectedCategory}`}
                                    </h3>
                                    <p className="text-slate-400 text-sm mt-1">
                                        High-priority implementations demonstrating end-to-end architecture, technical complexity, and measured business impact.
                                    </p>
                                </div>
                                <span className="text-xs font-mono text-cyan-400 bg-cyan-950/40 border border-cyan-800 px-3 py-1.5 rounded-full shrink-0">
                                    Ranked #01 - #03
                                </span>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {topFeaturedProjects.map((project, idx) => (
                                    <TopProjectCard 
                                        key={project.id || idx} 
                                        project={project} 
                                        rank={idx + 1}
                                        onOpenModal={setSelectedProject}
                                    />
                                ))}
                            </div>
                        </AnimatedSection>
                    )}

                    <AnimatedSection className="space-y-6">
                        <div className="flex items-center justify-between border-b border-slate-800 pb-4">
                            <div>
                                <h3 className="text-2xl font-bold text-white flex items-center gap-2">
                                    {Layers && <Layers className="w-6 h-6 text-cyan-400" />} Solutions Catalog
                                </h3>
                                <p className="text-slate-400 text-xs sm:text-sm mt-0.5">
                                    Browse, search, and analyze all projects across domains and industry specializations.
                                </p>
                            </div>
                            <span className="text-xs font-mono text-slate-400 bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700">
                                {filteredProjects.length} Available
                            </span>
                        </div>

                        {filteredProjects.length === 0 ? (
                            <div className="bg-slate-800/40 p-12 rounded-3xl border border-slate-700 text-center space-y-4">
                                <div className="w-16 h-16 bg-slate-900 rounded-2xl flex items-center justify-center mx-auto text-slate-500 border border-slate-700">
                                    {Search ? <Search className="w-8 h-8 text-slate-500" /> : <Terminal className="w-8 h-8 text-slate-500" />}
                                </div>
                                <h4 className="text-xl font-bold text-white">No projects found</h4>
                                <p className="text-slate-400 text-sm max-w-md mx-auto">
                                    No projects matched your current search or filter combination. Try clearing your filters or searching for different keywords.
                                </p>
                                <button
                                    onClick={handleResetFilters}
                                    className="px-5 py-2.5 bg-cyan-600 hover:bg-cyan-500 text-white rounded-xl text-xs font-bold transition-all shadow-md shadow-cyan-500/20"
                                >
                                    Reset All Filters
                                </button>
                            </div>
                        ) : (
                            <>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {filteredProjects.slice(0, visibleCount).map((project, idx) => (
                                        <ProjectCard 
                                            key={project.id || idx} 
                                            project={project} 
                                            onOpenModal={setSelectedProject}
                                        />
                                    ))}
                                </div>

                                {filteredProjects.length > 9 && (
                                    <div className="flex justify-center pt-8">
                                        {visibleCount < filteredProjects.length ? (
                                            <button
                                                onClick={() => setVisibleCount(prev => prev + 9)}
                                                className="px-8 py-3.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-cyan-400 text-white rounded-xl font-bold text-sm transition-all shadow-lg hover:shadow-[0_0_20px_rgba(6,182,212,0.3)] flex items-center gap-2 group"
                                            >
                                                View More Projects ({filteredProjects.length - visibleCount} remaining)
                                                {ChevronDown && <ChevronDown className="w-4 h-4 group-hover:translate-y-1 transition-transform text-cyan-400" />}
                                            </button>
                                        ) : (
                                            <button
                                                onClick={() => setVisibleCount(9)}
                                                className="px-6 py-2.5 bg-slate-800/80 hover:bg-slate-700 border border-slate-700 text-slate-400 hover:text-white rounded-xl font-semibold text-xs transition-all flex items-center gap-2"
                                            >
                                                Show Less
                                            </button>
                                        )}
                                    </div>
                                )}
                            </>
                        )}
                    </AnimatedSection>
                </div>
            );
        };

        const ChatWidget = () => {
            const [isOpen, setIsOpen] = useState(false);
            const [messages, setMessages] = useState([{ role: 'assistant', text: "Hi! I'm Shahd's AI Assistant. Ask about her skills!" }]);
            const [inputValue, setInputValue] = useState('');
            const [isTyping, setIsTyping] = useState(false);
            const messagesEndRef = useRef(null);

            useEffect(() => { messagesEndRef.current?.scrollIntoView({ behavior: "smooth" }) }, [messages]);

            const handleSend = async () => {
                if (!inputValue.trim()) return;
                const userMsg = inputValue;
                setInputValue('');
                setMessages(prev => [...prev, { role: 'user', text: userMsg }]);
                setIsTyping(true);
                const aiResponseText = await callGemini(userMsg, "You are Shahd Kordy's AI assistant. Answer briefly.");
                setIsTyping(false);
                setMessages(prev => [...prev, { role: 'assistant', text: aiResponseText }]);
            };

            return (
                <div className="fixed bottom-6 right-6 z-50 flex flex-col items-end">
                    {isOpen && (
                        <div className="bg-slate-800 border border-slate-700 w-80 sm:w-96 h-96 rounded-2xl shadow-2xl mb-4 flex flex-col overflow-hidden animate-in slide-in-from-bottom-5 fade-in duration-300">
                            <div className="bg-slate-900 p-4 border-b border-slate-700 flex justify-between items-center">
                                <div className="flex items-center gap-2"><div className="w-8 h-8 bg-cyan-600 rounded-full flex items-center justify-center">{Bot && <Bot className="w-5 h-5 text-white" />}</div><div><h4 className="text-sm font-bold text-white">Shahd's AI Agent</h4><div className="flex items-center gap-1"><span className="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span><span className="text-[10px] text-slate-400 font-medium">Online</span></div></div></div>
                                <button onClick={() => setIsOpen(false)} className="text-slate-400 hover:text-white">{X && <X className="w-5 h-5" />}</button>
                            </div>
                            <div className="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-900/50">
                                {messages.map((msg, idx) => (<div key={idx} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}><div className={`max-w-[80%] p-3 rounded-2xl text-sm ${msg.role === 'user' ? 'bg-cyan-600 text-white rounded-br-none shadow-md' : 'bg-slate-800 text-slate-200 border border-slate-700 rounded-bl-none shadow-md'}`}>{msg.text}</div></div>))}
                                {isTyping && <div className="flex justify-start"><div className="bg-slate-800 p-3 rounded-2xl rounded-bl-none border border-slate-700 shadow-md flex gap-1"><span className="w-1.5 h-1.5 bg-slate-500 rounded-full animate-bounce"></span><span className="w-1.5 h-1.5 bg-slate-500 rounded-full animate-bounce delay-100"></span><span className="w-1.5 h-1.5 bg-slate-500 rounded-full animate-bounce delay-200"></span></div></div>}
                                <div ref={messagesEndRef} />
                            </div>
                            <div className="p-3 bg-slate-900 border-t border-slate-700"><div className="relative"><input type="text" value={inputValue} onChange={(e) => setInputValue(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && handleSend()} placeholder="Ask me anything..." className="w-full bg-slate-800 text-white text-sm rounded-full pl-4 pr-10 py-2.5 border border-slate-700 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500" /><button onClick={handleSend} disabled={!inputValue.trim()} className="absolute right-1 top-1 p-1.5 bg-cyan-600 rounded-full text-white hover:bg-cyan-500 disabled:opacity-50 transition-colors">{Send && <Send className="w-4 h-4" />}</button></div></div>
                        </div>
                    )}
                    <button onClick={() => setIsOpen(!isOpen)} className="group flex items-center justify-center w-14 h-14 bg-gradient-to-r from-cyan-500 to-blue-600 rounded-full shadow-[0_0_20px_rgba(6,182,212,0.4)] hover:shadow-[0_0_30px_rgba(6,182,212,0.6)] transition-all hover:scale-105">
                        {isOpen ? (X ? <X className="w-6 h-6 text-white" /> : "X") : (MessageSquare ? <MessageSquare className="w-6 h-6 text-white" /> : "💬")}
                        {!isOpen && <span className="absolute -top-1 -right-1 flex h-3 w-3"><span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span><span className="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span></span>}
                    </button>
                </div>
            );
        };

        function Portfolio() {
            const [activeTab, setActiveTab] = useState('experience');
            const [isGalleryOpen, setIsGalleryOpen] = useState(false);

            return (
                <div className="min-h-screen font-sans selection:bg-cyan-500/30 selection:text-cyan-200 overflow-x-hidden">
                    
                    <CardGallery isOpen={isGalleryOpen} onClose={() => setIsGalleryOpen(false)} />

                    <div className="fixed inset-0 z-0 pointer-events-none">
                        <div className="absolute inset-0 bg-[linear-gradient(to_right,#334155_1px,transparent_1px),linear-gradient(to_bottom,#334155_1px,transparent_1px)] bg-[size:32px_32px] opacity-20"></div>
                        <div className="absolute top-0 left-1/4 w-96 h-96 bg-cyan-500/10 rounded-full blur-3xl animate-pulse"></div>
                        <div className="absolute bottom-0 right-1/4 w-96 h-96 bg-blue-600/10 rounded-full blur-3xl animate-pulse delay-1000"></div>
                    </div>

                    <nav className="fixed top-0 w-full z-50 bg-slate-900/80 backdrop-blur-md border-b border-slate-700/50 shadow-sm">
                        <div className="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
                            <div className="text-xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent flex items-center gap-2">
                                {Terminal && <Terminal className="w-6 h-6 text-cyan-400" />} SHAHD M KORDY_
                            </div>
                            <div className="flex gap-4 items-center">
